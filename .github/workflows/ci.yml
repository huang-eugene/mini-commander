name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

# A branch with an open pull request matches both triggers above, which ran
# the whole matrix twice over the same commit. Keying on the head SHA collapses
# those two into one, and cancels a run that a newer push has already
# superseded.
concurrency:
  group: ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    # Windows is not optional here: it is the only place the path jail's
    # drive-letter/UNC/reserved-name handling and the ASCII glyph fallback
    # actually get proven.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Node 20 went end-of-life in April 2026. It is also the one version
        # that cannot run `npm test`: glob patterns in `node --test` positional
        # arguments need Node 22, and on 20 the command fails outright with
        # "Could not find". See `engines` in package.json.
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Via the bin shim, not dist/cli.js: cli.js only *exports* main, so
      # running it directly exits 0 without playing anything — a self-check
      # that silently passes is worse than none.
      - name: Self-check (boots a temp world and plays a scripted mission)
        run: node bin/mini-commander.js --self-check

      - name: Pack
        run: npm pack --dry-run
